[package]
name = "carillon-core"
description = "Shared async watch client for Carillon"
version = "0.0.0"
authors = ["soywod <pimalaya.org@posteo.net>"]
rust-version = "1.88"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["email", "asynchronous"]
keywords = ["watch", "imap", "carddav", "idle", "notification"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/carillon-core/latest/carillon_core"
repository = "https://github.com/pimalaya/carillon-core"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
rand = "0.10"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["sync"] }
